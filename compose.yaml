services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siswa_pos
      POSTGRES_USER: siswa_pos
      POSTGRES_PASSWORD: change-me-in-local-env
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siswa_pos -d siswa_pos"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - siswa-pos-postgres:/var/lib/postgresql/data

volumes:
  siswa-pos-postgres:
