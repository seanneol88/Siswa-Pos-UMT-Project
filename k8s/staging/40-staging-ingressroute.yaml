---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: siswa-pos-cloudflared-origin-only
  namespace: siswa-pos
spec:
  ipAllowList:
    sourceRange:
      - 127.0.0.1/32
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: siswa-pos-staging
  namespace: siswa-pos
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`staging.siswapos.app`)
      middlewares:
        - name: siswa-pos-cloudflared-origin-only
      services:
        - name: siswa-pos-web
          port: 80
