apiVersion: apps/v1
kind: Deployment
metadata:
  name: siswa-pos-web
  namespace: siswa-pos
  labels:
    app.kubernetes.io/name: siswa-pos-web
    app.kubernetes.io/version: "d6806d7"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: siswa-pos-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: siswa-pos-web
        app.kubernetes.io/version: "d6806d7"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      containers:
        - name: web
          image: docker.io/library/siswa-pos:landing-d6806d7
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_PUBLIC_APP_URL
              value: https://staging.siswapos.app
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: siswa-pos-runtime
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: siswa-pos-web
  namespace: siswa-pos
spec:
  selector:
    app.kubernetes.io/name: siswa-pos-web
  ports:
    - name: http
      port: 80
      targetPort: http
